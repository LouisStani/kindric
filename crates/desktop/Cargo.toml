[package]
name = "kindric-desktop"
description = "Desktop interface of kindric"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kindric-core = { path = "../core" }
portable-pty = "0.9"
serde.workspace = true
serde_json.workspace = true
tauri = "2.12"
# The system's file picker, to add artifacts by hand (decision 267).
tauri-plugin-dialog = "2.8"

# The signal's haze over every window: Wayland's layer shell, in pure Rust (no system library).
[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false }
# The signal's message: letters drawn from a system font, in pure Rust.
fontdue = "0.9"

[build-dependencies]
tauri-build = "2.7"
