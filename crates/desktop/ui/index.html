<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>kindric</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-webgl.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header id="bar">
    <nav id="tabs"></nav>
    <ol id="chips"></ol>
    <p id="status"></p>
  </header>
  <div id="work">
    <main id="panes"></main>
    <section id="welcome" hidden>
      <h1>get started</h1>
      <ol id="welcome-list" class="checks"></ol>
      <p class="muted">F1 shows this list again</p>
    </section>
  </div>
  <div id="tip" hidden></div>
  <dialog id="new-session">
    <form id="new-form">
      <h1>new session</h1>
      <label>account <select name="account"></select></label>
      <label>directory <input name="directory" spellcheck="false" autocomplete="off"></label>
      <ol class="suggestions" hidden></ol>
      <label>short name <input name="name" placeholder="e.g. router (else Claude Code picks one)" spellcheck="false" autocomplete="off"></label>
      <p id="new-message"></p>
      <button type="submit">start</button>
    </form>
  </dialog>
  <dialog id="helper">
    <h1 id="helper-title"></h1>
    <p class="muted" id="helper-hint"></p>
    <p id="helper-subject"></p>
    <div id="helper-screen"></div>
    <p id="helper-message"></p>
    <div class="buttons">
      <button type="button" id="helper-done">done</button>
    </div>
  </dialog>
  <dialog id="new-project">
    <form id="project-form">
      <h1>new project</h1>
      <label>directory <input name="directory" spellcheck="false" autocomplete="off"></label>
      <ol class="suggestions" hidden></ol>
      <p id="project-message"></p>
      <button type="submit">add</button>
    </form>
  </dialog>
  <dialog id="rename">
    <form id="rename-form">
      <h1>short name</h1>
      <label>name <input name="label" placeholder="empty: Claude Code's name" spellcheck="false" autocomplete="off"></label>
      <p id="rename-message"></p>
      <button type="submit">save</button>
    </form>
  </dialog>
  <dialog id="confirm-hide">
    <form id="hide-form">
      <h1>hide session</h1>
      <p id="hide-question"></p>
      <div class="buttons">
        <button type="button" id="hide-cancel">cancel</button>
        <button type="submit">hide</button>
      </div>
    </form>
  </dialog>
  <dialog id="settings">
    <h1>settings</h1>
    <section class="settings-section">
      <h2>accounts</h2>
      <ul class="accounts-list"></ul>
      <form class="accounts-add">
        <label>new account <input name="name" placeholder="e.g. work" spellcheck="false" autocomplete="off"></label>
        <button type="submit">add</button>
      </form>
      <p class="accounts-message"></p>
    </section>
  </dialog>
  <dialog id="artifacts" tabindex="-1">
    <h1 class="artifacts-title">artifacts</h1>
    <div class="artifacts-body"></div>
    <p class="artifacts-hint muted"></p>
  </dialog>
  <dialog id="messages">
    <h1 id="messages-title">messages</h1>
    <ol id="messages-list"></ol>
  </dialog>
  <dialog id="help">
    <h1>get started</h1>
    <ol id="help-checks" class="checks"></ol>
    <h1>shortcuts</h1>
    <div id="help-list"></div>
  </dialog>
  <dialog id="picker">
    <input id="picker-query" placeholder="search sessions" spellcheck="false" autocomplete="off">
    <ol id="picker-results"></ol>
  </dialog>
</body>
</html>
