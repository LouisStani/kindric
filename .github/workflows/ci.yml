name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System libraries for Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # The parts of the page that need no browser have a ui/<module>.test.js beside them; they need nothing but Node.
      # Every one is run, so that a new test file cannot be left out.
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
      - name: JavaScript tests (Linux)
        if: runner.os == 'Linux'
        run: node --test crates/desktop/ui/*.test.js
      - run: cargo build --locked --release -p kindric-accounts
      - name: kindric-accounts command-line tests (Linux)
        if: runner.os == 'Linux'
        run: CA_BIN=target/release/kindric-accounts crates/accounts/tests.sh
      - name: kindric-accounts smoke test (macOS)
        if: runner.os == 'macOS'
        run: crates/accounts/ci/smoke.sh target/release/kindric-accounts
      - name: kindric-accounts smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: crates/accounts/ci/smoke.ps1 target/release/kindric-accounts.exe

  # The installers of packaging/, run on each system against an archive packed here and served on
  # localhost, as a release would serve it: install, run the programs, uninstall.
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries for Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo build --locked --release -p kindric -p kindric-accounts -p kindric-desktop
      - name: Pack the archive and its SHA256SUMS
        shell: bash
        run: |
          packaging/package.sh ${{ matrix.target }} target/release dist
          cd dist && { sha256sum kindric-* 2> /dev/null || shasum -a 256 kindric-*; } > SHA256SUMS && cat SHA256SUMS
      # Nobody opened the app on a real Mac or PC: it is opened here, on the runner's screen, and its
      # screenshot is kept with the run.
      - name: Open the app (macOS)
        if: runner.os == 'macOS'
        run: packaging/ci/open-app.sh target/release app-screen
      - name: Open the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/ci/open-app.ps1 target/release app-screen
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Linux'
        with:
          name: app-screen-${{ matrix.target }}
          path: app-screen/
          if-no-files-found: ignore
      - name: Install, run and uninstall (Linux, macOS)
        if: runner.os != 'Windows'
        run: packaging/ci/test-install.sh dist
      - name: Install, run and uninstall (Windows, PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/ci/test-install.ps1 dist
      # Windows PowerShell 5.1 is the one Windows comes with.
      - name: Install, run and uninstall (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: packaging/ci/test-install.ps1 dist

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, installers]
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, so that the programs run on systems with an older glibc than the newest runner's.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: System libraries for Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo build --locked --release -p kindric -p kindric-accounts -p kindric-desktop --target ${{ matrix.target }}
      # The archive the installers download, and kindric-accounts alone, as its README installs it.
      - name: Pack the archive
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          packaging/package.sh ${{ matrix.target }} "target/${{ matrix.target }}/release" dist
          cp "target/${{ matrix.target }}/release/kindric-accounts$ext" "dist/kindric-accounts-${{ matrix.target }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Only the archives of the build job: the installers job uploads its screenshots too.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Add the installers and the checksums
        run: |
          cp packaging/install.sh packaging/install.ps1 dist/
          cd dist && sha256sum * > SHA256SUMS
      - run: ls -l dist
      - name: Attach the binaries to the release, creating it if needed
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # A tag with a dash (v1.1.0-rc.1) is a pre-release: never "latest", which the installers download.
            prerelease=""
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
