[workspace]
members = ["crates/accounts", "crates/core", "crates/desktop", "crates/tui"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "CC-BY-NC-SA-4.0"
publish = false

[workspace.dependencies]
claude-accounts = { path = "crates/accounts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
