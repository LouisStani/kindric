[workspace]
members = ["crates/accounts", "crates/core", "crates/desktop", "crates/tui"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
kindric-accounts = { path = "crates/accounts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Symbols removed from the installed programs: about a third of their size (21 MB to 14 MB),
# at no build cost. A panic then prints a backtrace without function names.
[profile.release]
strip = true
